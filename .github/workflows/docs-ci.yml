name: Docs CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate docs (links, slugs, frontmatter, assets, OpenAPI, terminology)
        run: pnpm validate
      - name: Docs-agent tests
        run: pnpm test
      - name: Docs-agent audit (advisory)
        run: pnpm docs-agent audit --docs-repo . --json || true
      - name: Production build (same command as Cloudflare Pages)
        run: pnpm run build
